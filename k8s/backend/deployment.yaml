apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-backend
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: taskflow-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: backend
        image: 569360421892.dkr.ecr.us-east-1.amazonaws.com/task-backend:sha-a0e3bb9
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: taskflow-backend-secret
              key: db_host
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: taskflow-backend-secret
              key: db_name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: taskflow-backend-secret
              key: db_username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: taskflow-backend-secret
              key: db_password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: taskflow-backend-secret
              key: jwt_secret
        - name: DB_SSL
          value: "true"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000