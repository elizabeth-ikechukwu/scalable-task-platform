name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 424522917561.dkr.ecr.us-east-1.amazonaws.com
  DOCKERHUB_REGISTRY: lizzycloudlab
  EC2_INSTANCE_ID: i-0293edd5462dfb9dc

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - name: Install backend dependencies
        working-directory: app/backend
        run: npm ci
      - name: Run ESLint
        working-directory: app/backend
        run: npx eslint . --ext .js --max-warnings=0

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - name: Install backend dependencies
        working-directory: app/backend
        run: npm ci
      - name: Run unit tests
        working-directory: app/backend
        run: npm test

  build-and-integration-test:
    name: Build & Integration Test
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: false
          load: true
          tags: task-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: false
          load: true
          tags: task-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack
        run: docker compose up -d
      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend health..."
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' task-backend 2>/dev/null || echo "not_found")
            echo "Attempt $i: backend = $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Backend is healthy."
              break
            fi
            if [ "$i" = "15" ]; then
              echo "Backend did not become healthy in time."
              docker compose logs backend
              exit 1
            fi
            sleep 5
          done
      - name: Wait for frontend to be healthy
        run: |
          echo "Waiting for frontend health..."
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' task-frontend 2>/dev/null || echo "not_found")
            echo "Attempt $i: frontend = $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Frontend is healthy."
              break
            fi
            if [ "$i" = "15" ]; then
              echo "Frontend did not become healthy in time."
              docker compose logs frontend
              exit 1
            fi
            sleep 5
          done
      - name: Assert backend health endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/health)
          echo "GET /api/health returned: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAILED: expected 200, got $HTTP_STATUS"
            docker compose logs
            exit 1
          fi
          echo "PASSED"
      - name: Assert frontend serves 200
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost)
          echo "GET / returned: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAILED: expected 200, got $HTTP_STATUS"
            docker compose logs
            exit 1
          fi
          echo "PASSED"
      - name: Print logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down stack
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: build-and-integration-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424522917561:role/github-actions-scalable-task-platform
          aws-region: us-east-1
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/task-backend:latest
            ${{ env.ECR_REGISTRY }}/task-backend:sha-${{ steps.vars.outputs.sha }}
            ${{ env.DOCKERHUB_REGISTRY }}/task-backend:latest
            ${{ env.DOCKERHUB_REGISTRY }}/task-backend:sha-${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/task-frontend:latest
            ${{ env.ECR_REGISTRY }}/task-frontend:sha-${{ steps.vars.outputs.sha }}
            ${{ env.DOCKERHUB_REGISTRY }}/task-frontend:latest
            ${{ env.DOCKERHUB_REGISTRY }}/task-frontend:sha-${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Job summary
        run: |
          echo "### Published Images - $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ECR**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_REGISTRY }}/task-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_REGISTRY }}/task-backend:sha-${{ steps.vars.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_REGISTRY }}/task-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_REGISTRY }}/task-frontend:sha-${{ steps.vars.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Hub**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_REGISTRY }}/task-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_REGISTRY }}/task-backend:sha-${{ steps.vars.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_REGISTRY }}/task-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_REGISTRY }}/task-frontend:sha-${{ steps.vars.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: build-and-integration-test
    if: github.event_name == 'pull_request'
    concurrency:
      group: terraform
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424522917561:role/github-actions-scalable-task-platform
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
      - name: Terraform Init
        run: terraform init
      - name: Terraform Plan
        run: terraform plan -no-color -lock-timeout=5m
        env:
          TF_VAR_aws_account_id: ${{ secrets.TF_VAR_AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ secrets.TF_VAR_AWS_REGION }}
          TF_VAR_db_name: ${{ secrets.TF_VAR_db_name }}
          TF_VAR_db_username: ${{ secrets.TF_VAR_db_username }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_db_host: ${{ secrets.TF_VAR_db_host }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: terraform
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424522917561:role/github-actions-scalable-task-platform
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply - provision SSM and infrastructure
        run: terraform apply -auto-approve -lock-timeout=5m
        env:
          TF_VAR_aws_account_id: ${{ secrets.TF_VAR_AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ secrets.TF_VAR_AWS_REGION }}
          TF_VAR_db_name: ${{ secrets.TF_VAR_db_name }}
          TF_VAR_db_username: ${{ secrets.TF_VAR_db_username }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_db_host: ${{ secrets.TF_VAR_db_host }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
      - name: Capture RDS hostname
        id: rds
        run: |
          RDS_HOST=$(terraform output -raw rds_hostname)
          echo "hostname=$RDS_HOST" >> $GITHUB_OUTPUT
      - name: Terraform Apply - wire EC2 with RDS hostname
        run: terraform apply -auto-approve -lock-timeout=5m
        env:
          TF_VAR_aws_account_id: ${{ secrets.TF_VAR_AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ secrets.TF_VAR_AWS_REGION }}
          TF_VAR_db_name: ${{ secrets.TF_VAR_db_name }}
          TF_VAR_db_username: ${{ secrets.TF_VAR_db_username }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_db_host: ${{ steps.rds.outputs.hostname }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
      - name: Job summary
        run: |
          echo "### Terraform Apply - $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- RDS hostname: \`${{ steps.rds.outputs.hostname }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- SSM parameters provisioned" >> $GITHUB_STEP_SUMMARY
          echo "- EC2 startup script fetches secrets from SSM at runtime" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424522917561:role/github-actions-scalable-task-platform
          aws-region: us-east-1

      - name: Deploy new images to EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo \"--- Authenticating to ECR ---\"",
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 424522917561.dkr.ecr.us-east-1.amazonaws.com",
              "echo \"--- Pulling latest images ---\"",
              "docker pull 424522917561.dkr.ecr.us-east-1.amazonaws.com/task-backend:latest",
              "docker pull 424522917561.dkr.ecr.us-east-1.amazonaws.com/task-frontend:latest",
              "echo \"--- Stopping old containers ---\"",
              "docker stop task-backend task-frontend || true",
              "docker rm task-backend task-frontend || true",
              "echo \"--- Fetching secrets from SSM ---\"",
              "DB_HOST=$(aws ssm get-parameter --name /scalable-task-platform/db_host --with-decryption --query Parameter.Value --output text --region us-east-1)",
              "DB_NAME=$(aws ssm get-parameter --name /scalable-task-platform/db_name --with-decryption --query Parameter.Value --output text --region us-east-1)",
              "DB_USER=$(aws ssm get-parameter --name /scalable-task-platform/db_username --with-decryption --query Parameter.Value --output text --region us-east-1)",
              "DB_PASSWORD=$(aws ssm get-parameter --name /scalable-task-platform/db_password --with-decryption --query Parameter.Value --output text --region us-east-1)",
              "JWT_SECRET=$(aws ssm get-parameter --name /scalable-task-platform/jwt_secret --with-decryption --query Parameter.Value --output text --region us-east-1)",
              "echo \"--- Starting backend ---\"",
              "docker run -d --name task-backend --restart unless-stopped -p 3000:3000 -e DB_HOST=$DB_HOST -e DB_PORT=5432 -e DB_NAME=$DB_NAME -e DB_USER=$DB_USER -e DB_PASSWORD=$DB_PASSWORD -e DB_SSL=true -e JWT_SECRET=$JWT_SECRET 424522917561.dkr.ecr.us-east-1.amazonaws.com/task-backend:latest",
              "sleep 5",
              "echo \"--- Starting frontend with HTTPS ---\"",
              "docker run -d --name task-frontend --restart unless-stopped -p 80:80 -p 443:443 -v /etc/letsencrypt:/etc/letsencrypt:ro --link task-backend:backend 424522917561.dkr.ecr.us-east-1.amazonaws.com/task-frontend:latest",
              "sleep 3",
              "echo \"--- Applying HTTPS nginx config ---\"",
              "docker cp /home/ec2-user/nginx-https.conf task-frontend:/etc/nginx/conf.d/default.conf",
              "docker exec task-frontend nginx -s reload",
              "echo \"--- Deployment complete ---\"",
              "docker ps"
            ]' \
            --output text \
            --query "Command.CommandId" > /tmp/command-id.txt

          COMMAND_ID=$(cat /tmp/command-id.txt)
          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment to complete..."
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: status = $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded."
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              break
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            if [ "$i" = "30" ]; then
              echo "Deployment timed out waiting for SSM command."
              exit 1
            fi
            sleep 10
          done

      - name: Job summary
        run: |
          echo "### Deployment Complete - $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- New images pulled from ECR" >> $GITHUB_STEP_SUMMARY
          echo "- Containers restarted with HTTPS enabled" >> $GITHUB_STEP_SUMMARY
          echo "- SSL certificate mounted from Let's Encrypt" >> $GITHUB_STEP_SUMMARY
          echo "- HTTPS nginx config applied from /home/ec2-user/nginx-https.conf" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets fetched from SSM Parameter Store" >> $GITHUB_STEP_SUMMARY
          echo "- Instance: \`${{ env.EC2_INSTANCE_ID }}\`" >> $GITHUB_STEP_SUMMARY
