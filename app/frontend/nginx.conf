# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name taskflow.lizzycloudlab.online lizzycloudlab.online;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name taskflow.lizzycloudlab.online lizzycloudlab.online;

    ssl_certificate     /etc/letsencrypt/live/taskflow.lizzycloudlab.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskflow.lizzycloudlab.online/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
