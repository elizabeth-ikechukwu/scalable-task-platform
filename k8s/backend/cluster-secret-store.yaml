apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: taskflow-ssm-store
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: secret-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: taskflow-backend-sa
            namespace: taskflow