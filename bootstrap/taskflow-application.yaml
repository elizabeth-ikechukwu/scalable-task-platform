apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow
  namespace: argocd
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: |
      backend=569360421892.dkr.ecr.us-east-1.amazonaws.com/task-backend,
      frontend=569360421892.dkr.ecr.us-east-1.amazonaws.com/task-frontend
    argocd-image-updater.argoproj.io/backend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/frontend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/elizabeth-ikechukwu/scalable-task-platform.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true