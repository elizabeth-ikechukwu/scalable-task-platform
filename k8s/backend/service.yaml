  name: taskflow-backend-svc
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-backend
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: taskflow-backend
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP